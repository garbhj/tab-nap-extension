<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tab Sleeper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span class="title">Tab Sleeper</span>
    <span class="ver">v1.0.0</span>
  </div>
  <p class="subtitle">A more convenient way to discard tabs. Right-click on a tab to discard it.</p>
  <label class="row">
    <span class="label">Auto</span>
    <button id="toggle" class="switch" role="switch" aria-checked="false" aria-label="Toggle extension">
      <span class="knob"></span>
    </button>
  </label>
  <script src="popup.js"></script>
</body>
</html>
